services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krishi_backend_prod
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - APP_DATA_DIR=/app/storage
      - PYTHONUNBUFFERED=1
    volumes:
      - krishi_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: krishi_frontend_prod
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  krishi_storage:
