services:
  - type: web
    name: krishi-drishti-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: APP_DATA_DIR
        value: /app/storage
      - key: LOW_MEMORY_MODE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: krishi-drishti-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
