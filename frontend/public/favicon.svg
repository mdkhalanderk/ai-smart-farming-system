<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="22" fill="#183623"/>
  <!-- Two leaves sprouting above A -->
  <g transform="translate(68, 25)">
    <!-- Left Leaf -->
    <path d="M 0,15 C -12,12 -14,-2 -2,-4 C 5,2 3,11 0,15 Z" fill="#84a585"/>
    <path d="M 0,15 C -5,7 -4,1 -2,-4" stroke="#5d7b5e" stroke-width="0.8" fill="none"/>
    <!-- Right Leaf -->
    <path d="M 0,15 C 3,7 9,0 17,4 C 18,12 10,16 0,15 Z" fill="#84a585"/>
    <path d="M 0,15 C 6,10 10,6 17,4" stroke="#5d7b5e" stroke-width="0.8" fill="none"/>
  </g>
  <!-- S C A Typography -->
  <text x="50" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#f4f6f0" letter-spacing="4" text-anchor="middle">SCA</text>
</svg>
